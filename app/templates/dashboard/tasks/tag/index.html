<ul class="dashboard-tag-list">
    {% for i in task.tags%}
        <li>
            <span>{{i.name}}</span>
            <form action="{{ url_for('tasks.remove_tag', id=id) }}" method="post" class="ms-auto">
                {{ formTagRemove.csrf_token }}
                {{ formTagRemove.tag(value=i.id) }}
                <button class="btn btn-outline-danger btn-sm" type="submit">Quitar</button>
            </form>
        </li>
    {% endfor %}    
</ul>
