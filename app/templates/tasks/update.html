{% extends "base.html" %}

{% block title %} Update {% endblock %}

{% block content %} 
    <form action="" method="post", enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        {% include 'tasks/_form.html'%}
    </form>

    {% if document %}
        <p>Current file: {{ document.filename }}</p>
    {% else %}
        <p>No file uploaded yet.</p>
    {% endif %}

{% endblock %}
